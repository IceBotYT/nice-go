name: Test

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Gather changed files
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
      run_actionlint: ${{ steps.changes.outputs.run_actionlint }}
    steps:
      - uses: actions/checkout@v7
      - name: Gather changed files
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            run_tests:
              - 'src/**'
              - 'tests/**'
            run_actionlint:
              - '.github/workflows/**'

  actionlint:
    name: Check workflow files
    needs: changes
    if: needs.changes.outputs.run_actionlint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.6.21
        shell: bash
      - name: Check workflow files
        run: ./actionlint -color
        shell: bash

  lint-cruft:
    name: Check if automatic project update was successful
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if .rej files exist as structure update was not successful
        run: test -z "$(find . -iname '*.rej')"

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-poetry-env
      - run: poetry run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    needs:
      - changes
      - lint-cruft
      - pre-commit
    if: needs.changes.outputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-poetry-env
        with:
          python-version: ${{ matrix.python-version }}
      - run: poetry run pytest --cov=src tests --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  docs:
    needs: [changes, test]
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-poetry-env
      - run: poetry run mkdocs build

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v7
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8.0.1
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
